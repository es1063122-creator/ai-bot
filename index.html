<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동진 Safety AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --dj:#004080;
  --dj2:#2a6cf6;
  --bg:#f4f7ff;
  --line:#d0d7e6;
  --err:#e53935;
}
html{font-size:16px;}
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:var(--bg);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== 상단 ===== */
.topbar{
  background:linear-gradient(135deg,var(--dj),var(--dj2));
  color:#fff;
  padding:1.2rem 1rem;
  font-size:1.3rem;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}
#sessionBadge{font-size:.75rem;opacity:.85;}

/* ===== 채팅 ===== */
.chat{
  flex:1;
  overflow-y:auto;
  padding:1.2rem;
  display:flex;
  flex-direction:column;
  gap:1rem;
}

/* ===== 말풍선 ===== */
.bubble{
  padding:1rem 1.2rem;
  border-radius:1.2rem;
  line-height:1.7;
  white-space:pre-wrap;
  font-size:1rem;
  max-width:85%;
}
.me{
  background:var(--dj);
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}
.ai{
  background:#fff;
  color:#111;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  border-bottom-left-radius:6px;
  align-self:flex-start;
}
.ai.error{
  background:#fff5f5;
  color:var(--err);
  border:1px solid #ffd0d0;
}

/* 로딩 도트 애니메이션 */
.loading-dots::after{
  content:"";
  animation:dots 1.4s infinite;
}
@keyframes dots{
  0%  {content:""}
  33% {content:"."}
  66% {content:".."}
  100%{content:"..."}
}

/* 출처 토글 */
.sources-toggle{
  margin-top:.6rem;
  font-size:.8rem;
  color:#888;
  cursor:pointer;
  user-select:none;
}
.sources-toggle:hover{color:var(--dj2);}
.sources-box{
  display:none;
  margin-top:.5rem;
  font-size:.8rem;
  color:#555;
  border-top:1px solid var(--line);
  padding-top:.5rem;
}
.sources-box.open{display:block;}
.src-item{
  margin-bottom:.4rem;
  padding:.4rem .6rem;
  background:#f4f7ff;
  border-radius:.5rem;
  border-left:3px solid var(--dj2);
}
.src-item a{color:var(--dj2);text-decoration:none;}
.src-item a:hover{text-decoration:underline;}

/* ===== 입력 영역 ===== */
.composer{
  padding:1rem;
  background:#fff;
  border-top:1px solid var(--line);
  flex-shrink:0;
}
textarea{
  width:100%;
  min-height:72px;
  font-size:1rem;
  font-family:"Noto Sans KR",sans-serif;
  padding:.8rem;
  border-radius:1rem;
  border:1px solid var(--line);
  resize:none;
  box-sizing:border-box;
  transition:border-color .2s;
}
textarea:focus{outline:none;border-color:var(--dj2);}
.send{
  width:100%;
  margin-top:.8rem;
  font-size:1rem;
  padding:.9rem;
  border:0;
  background:var(--dj);
  color:#fff;
  border-radius:1rem;
  font-weight:700;
  cursor:pointer;
  transition:background .2s, opacity .2s;
}
.send:hover{background:var(--dj2);}
.send:disabled{opacity:.5;cursor:not-allowed;}
.controls{
  margin-top:.8rem;
  font-size:.9rem;
  display:flex;
  gap:1.2rem;
}
.controls label{cursor:pointer;}

/* ===== 모바일 ===== */
@media(max-width:600px){
  html{font-size:17px;}
  .topbar{font-size:1.1rem;}
  .bubble{font-size:1.05rem;}
  textarea,.send{font-size:1.05rem;}
}
</style>
</head>
<body>

<div class="topbar">
  <div>🏗 동진 본사 Safety AI</div>
  <div id="sessionBadge"></div>
</div>

<div id="chat" class="chat"></div>

<div class="composer">
  <textarea id="q" placeholder="질문 입력 (Enter=전송 / Shift+Enter=줄바꿈)"></textarea>
  <button class="send" id="sendBtn" onclick="send()">전송</button>
  <div class="controls">
    <label><input type="radio" name="mode" value="fast" checked> ⚡ 빠른</label>
    <label><input type="radio" name="mode" value="expert"> 🔍 전문가</label>
  </div>
</div>

<script>
/************************************************
 * ⭐ Apps Script URL (본인 것으로 교체)
 ************************************************/
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxhax9_om5XVyGKNUAMqhNbJXkPqbibLK_4XM-mUb7zavC3AbbWScolVJox86VmKkBE/exec";

// JSONP 타임아웃 (ms) — GAS 최대 응답 대기
const TIMEOUT_MS = 55000; // 55초

/************************************************
 * 세션 관리
 ************************************************/
const SESSION_KEY = "DJ_SAFETY_AI_SESSION";
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = "sess-" + Date.now();
  localStorage.setItem(SESSION_KEY, sessionId);
}
document.getElementById("sessionBadge").innerText = "세션: " + sessionId.slice(-8);

/************************************************
 * UI 헬퍼
 ************************************************/
const chatEl  = document.getElementById("chat");
const qEl     = document.getElementById("q");
const sendBtn = document.getElementById("sendBtn");

function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function addBubble(text, who, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + (who === "me" ? "me" : "ai") + (cls ? " " + cls : "");
  div.innerText = text;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setLoading(on) {
  sendBtn.disabled = on;
  qEl.disabled     = on;
}

/************************************************
 * 출처(sources) 렌더링
 ************************************************/
function renderSources(bubble, sources) {
  if (!sources || sources.length === 0) return;

  const toggle = document.createElement("div");
  toggle.className = "sources-toggle";
  toggle.innerText = "📎 근거 자료 " + sources.length + "건 보기 ▾";

  const box = document.createElement("div");
  box.className = "sources-box";

  sources.forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "src-item";
    const scoreText = s.score ? " (유사도 " + (s.score * 100).toFixed(0) + "%)" : "";
    const title = "[" + (i + 1) + "] " + (s.docTitle || "문서") + scoreText;
    if (s.link) {
      item.innerHTML = "<a href='" + s.link + "' target='_blank'>" + title + "</a>";
    } else {
      item.innerText = title;
    }
    box.appendChild(item);
  });

  toggle.addEventListener("click", function() {
    const open = box.classList.toggle("open");
    toggle.innerText = open
      ? "📎 근거 자료 " + sources.length + "건 닫기 ▴"
      : "📎 근거 자료 " + sources.length + "건 보기 ▾";
  });

  bubble.appendChild(toggle);
  bubble.appendChild(box);
}

/************************************************
 * JSONP 호출 (타임아웃 + 에러 핸들러 추가)
 ************************************************/
function send() {
  const q = qEl.value.trim();
  if (!q) return;

  addBubble(q, "me");
  qEl.value = "";
  setLoading(true);

  // 로딩 버블 (애니메이션)
  const loadingBubble = document.createElement("div");
  loadingBubble.className = "bubble ai";
  loadingBubble.innerHTML = "<span class='loading-dots'>답변 생성 중</span>";
  chatEl.appendChild(loadingBubble);
  scrollBottom();

  const callbackName = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  let done = false;
  let timer = null;

  // ✅ 정리 함수 (중복 실행 방지)
  function cleanup() {
    done = true;
    clearTimeout(timer);
    if (script.parentNode) script.remove();
    delete window[callbackName];
    if (loadingBubble.parentNode) chatEl.removeChild(loadingBubble);
    setLoading(false);
    scrollBottom();
  }

  // ✅ 성공 콜백
  window[callbackName] = function(data) {
    if (done) return;
    cleanup();

    if (!data || data.ok === false) {
      addBubble("❌ 오류: " + (data && data.error ? data.error : "응답 없음"), "ai", "error");
      return;
    }

    const answerBubble = addBubble(data.answer || "응답 없음", "ai");
    renderSources(answerBubble, data.sources);
    scrollBottom();
  };

  // ✅ 타임아웃 처리 (55초)
  timer = setTimeout(function() {
    if (done) return;
    cleanup();
    addBubble(
      "⏱ 응답 시간 초과 (55초)\n\n"
      + "GAS 서버가 응답하지 않았습니다.\n"
      + "• 전문가 모드는 응답이 오래 걸릴 수 있습니다.\n"
      + "• 빠른 모드로 다시 시도해 보세요.",
      "ai", "error"
    );
  }, TIMEOUT_MS);

  // ✅ 네트워크 에러 처리 (script 로드 실패)
  const script = document.createElement("script");
  script.onerror = function() {
    if (done) return;
    cleanup();
    addBubble(
      "❌ 네트워크 오류\n\nGAS 서버에 연결할 수 없습니다.\n인터넷 연결 또는 Apps Script URL을 확인하세요.",
      "ai", "error"
    );
  };

  const url = WEBAPP_URL
    + "?question="  + encodeURIComponent(q)
    + "&mode="      + getMode()
    + "&sessionId=" + encodeURIComponent(sessionId)
    + "&callback="  + callbackName;

  script.src = url;
  document.body.appendChild(script);
}

/************************************************
 * Enter 전송 / Shift+Enter 줄바꿈
 ************************************************/
qEl.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) send();
  }
});

/************************************************
 * 웰컴 메시지
 ************************************************/
(function() {
  const welcome = document.createElement("div");
  welcome.className = "bubble ai";
  welcome.innerText =
    "안녕하세요! 동진토건 본사 Safety AI입니다. 🏗\n\n"
    + "안전 관련 질문을 입력해 주세요.\n"
    + "• ⚡ 빠른 모드: 핵심 요약 (5~15초)\n"
    + "• 🔍 전문가 모드: 근거 인용 + 체크리스트 (20~50초)";
  chatEl.appendChild(welcome);
})();
</script>
</body>
</html>
