<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동진 건설안전법령 AI 도우미</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4361ee;
    --blue-light: #7b96f5;
    --blue-dark: #2c46cc;
    --bg: #f2f4ff;
    --white: #ffffff;
    --text: #1a1d3a;
    --text-muted: #8a8faf;
    --border: #e2e6ff;
    --user-bubble: linear-gradient(135deg, #4361ee, #2c46cc);
    --bot-bubble: #ffffff;
    --shadow: 0 4px 24px rgba(67,97,238,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
/* ── 카카오톡 AI 스타일 헤더 ── */
.header {
  height: 74px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, #4e6bff, #6f8dff);
  color: white;
  box-shadow: 0 4px 20px rgba(67,97,238,0.25);
}

.header-profile {
  width: 110px;          /* 크게 */
  height: auto;
  border-radius: 0;      /* 둥근 테두리 제거 */
  background: none;      /* 배경 제거 */
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.header-profile img {
  width: 110px;
  height: auto;
  object-fit: contain;
}

.header-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.header-status {
  font-size: 12px;
  opacity: 0.85;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: #40ff9c;
  border-radius: 50%;
  animation: blink 2.5s infinite;
}

.header-menu {
  font-size: 22px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: background 0.2s;
}

.header-menu:hover {
  background: rgba(255,255,255,0.2);
}

  /* ── 메시지 영역 ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: #d0d6ff; border-radius: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  /* ── 날짜 구분선 ── */
  .date-divider {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    position: relative;
    margin: 4px 0;
  }
  .date-divider::before, .date-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 28%;
    height: 1px;
    background: var(--border);
  }
  .date-divider::before { left: 0; }
  .date-divider::after { right: 0; }

  /* ── 메시지 ── */
  .msg {
    display: flex;
    gap: 9px;
    align-items: flex-end;
    animation: fadeUp 0.28s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 130px;          /* 3배 확대 (32 → 96) */
  height: auto;         /* 높이 자동 */
  border-radius: 0;     /* 원형 제거 */
  background: none;     /* 배경 제거 */
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: none;     /* 그림자 제거 */
  overflow: visible;    /* 잘림 방지 */
}

.msg.user .msg-avatar {
  background: none;
  box-shadow: none;
}

.msg-avatar img{
  width: 130px;          /* 캐릭터 크게 */
  height: auto;
  object-fit: contain;  /* 비율 유지 */
  border-radius: 0;     /* 둥근 테두리 제거 */
  display:block;
}
  .msg-col { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .msg.user .msg-col { align-items: flex-end; }

  .msg-name {
    font-size: 11px; color: var(--text-muted); font-weight: 600;
    padding: 0 4px;
  }

  .msg-bubble {
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.bot .msg-bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .msg.user .msg-bubble {
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 16px rgba(67,97,238,0.3);
  }

  .msg-time {
    font-size: 10.5px; color: var(--text-muted);
    padding: 0 4px;
  }

  /* ── 법령 카드 ── */
  .law-section {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .law-section-label {
    font-size: 11.5px; font-weight: 600;
    color: var(--text-muted);
    padding: 0 2px;
  }
  .law-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f0f4ff;
    border: 1.5px solid #d5dcff;
    border-radius: 12px;
    padding: 9px 13px;
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
  }
  .law-card:hover {
    background: #e2e8ff;
    border-color: var(--blue);
    transform: translateX(3px);
  }
  .law-card-icon {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #4361ee22, #4361ee11);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .law-card-body { flex: 1; min-width: 0; }
  .law-card-name {
    font-size: 13px; font-weight: 700;
    color: var(--blue-dark); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .law-card-sub {
    font-size: 11px; color: var(--text-muted); margin-top: 1px;
  }
  .law-card-arrow {
    font-size: 13px; color: var(--blue-light); flex-shrink: 0;
  }

  /* ── 빠른 질문 칩 ── */
  .quick-chips {
    display: flex; flex-wrap: wrap; gap: 7px;
    margin-top: 10px;
  }
  .chip {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 12.5px;
    color: var(--blue);
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .chip:hover {
    background: #4361ee;
    color: white;
    border-color: #4361ee;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(67,97,238,0.25);
  }

  /* ── 타이핑 ── */
  .typing-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 15px;
    background: white;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    box-shadow: var(--shadow);
  }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--blue-light);
    border-radius: 50%;
    animation: bounce 1.3s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.18s; }
  .typing-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-7px); }
  }

  /* ── 입력 영역 ── */
  .input-area {
    padding: 12px 16px 16px;
    background: white;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(67,97,238,0.08);
    background: white;
  }
  textarea#input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.55;
  }
  textarea#input::placeholder { color: #b0b5cc; }
  .send-btn {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #4361ee, #2c46cc);
    border: none; border-radius: 14px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 4px 14px rgba(67,97,238,0.35);
  }
  .send-btn:hover:not(:disabled) {
    transform: scale(1.07);
    box-shadow: 0 6px 20px rgba(67,97,238,0.45);
  }
  .send-btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding: 0 4px;
  }
  .input-footer-note { font-size: 11px; color: var(--text-muted); }
  .input-footer-count { font-size: 11px; color: #c0c5e0; }

  /* ── 모바일 ── */
  @media (max-width: 480px) {
    .header { height: 58px; padding: 0 16px; }
    .messages { padding: 16px 12px 8px; }
    .input-area { padding: 10px 12px 14px; }
  }
</style>
</head>
<body>

<!-- 헤더 -->
<!-- 카카오톡 스타일 헤더 -->
<div class="header">
  <div class="header-profile">
    <img src="https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/dj-ai-default.png" alt="bot">
  </div>

  <div class="header-info">
    <div class="header-title">동진 건설안전법령 AI 도우미</div>
    <div class="header-status">
      <span class="status-dot"></span>
      KDH-safety
    </div>
  </div>

  <div class="header-menu">⋮</div>
</div>

<!-- 메시지 목록 -->
<div class="messages" id="messages">
  <div class="date-divider" id="today-label"></div>

  <!-- 환영 메시지 -->
  <div class="msg bot">
    <div class="msg-avatar">
      <!-- ✅ 캐릭터(기본표정) -->
      <img class="bot-img" src="https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/dj-ai-default.png" alt="bot">
    </div>
    <div class="msg-col">
      <span class="msg-name">법령 AI</span>
      <div class="msg-bubble">
        안녕하세요! 👋<br>
        저는 <strong>동진 건설안전법령 전문 AI 동진이</strong>예요.<br>
        궁금한 법률 내용을 물어보시면, 관련 법령을 찾아서 쉽게 설명해드릴게요.
      </div>
<div class="quick-chips">
  <button class="chip" onclick="quickAsk('건설현장 안전관리자 선임 기준은?')">👷 안전관리자 선임</button>
  <button class="chip" onclick="quickAsk('관리감독자 정기교육 시간은?')">📚 관리감독자 교육</button>
  <button class="chip" onclick="quickAsk('건설업 안전보건관리비 사용 기준은?')">💰 안전관리비 사용</button>
  <button class="chip" onclick="quickAsk('하도급 업체 안전관리자 선임 대상 기준은?')">🏗 하도급 안전기준</button>
  <button class="chip" onclick="quickAsk('추락방지 안전난간 설치 기준은?')">🦺 추락방지 기준</button>
  <button class="chip" onclick="quickAsk('중대재해처벌법 처벌 기준은?')">⚖ 중대재해처벌법</button>
</div>
      <span class="msg-time" id="welcome-time"></span>
    </div>
  </div>
</div>

<!-- 입력 -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" placeholder="법령에 대해 궁금한 것을 물어보세요..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()" title="전송">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="input-footer">
    <span class="input-footer-note">⚖ 국가법령정보센터 기반 · 법적 효력 없음</span>
    <span class="input-footer-count" id="char-count">0 / 500</span>
  </div>
</div>

<script>
// ========================================
// 🔑 OpenAI API 키 (브라우저 노출 위험! 서버/프록시 권장)
// ⚠ 이미 노출된 키는 즉시 폐기/재발급하세요.
// ========================================
const GPT_API_KEY = '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';   // ← 여기에 새 키(sk-...) 넣기
// ========================================

// ==============================
// 🔑 법령 API 키 (발급 후 입력)
// 발급: https://open.law.go.kr → 회원가입 → 오픈API 신청
// ==============================
const LAW_API_KEY = 'es5183';  // 법령 Open API 키
// ==============================

// ✅ 캐릭터 이미지 베이스(4종)
const BOT_BASE = "https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/";
// dj-ai-default.png / dj-ai-thinking.png / dj-ai-warning.png / dj-ai-error.png

const CLAUDE_SYSTEM = `당신은 대한민국 법령 전문 AI 어시스턴트입니다.

[규칙]
1. 반드시 대한민국 법령(법률, 시행령, 시행규칙)에 근거해서만 답변합니다.
2. 법령과 무관한 질문에는 "법령 관련 질문만 답변드릴 수 있어요 😊"라고 안내하세요.
3. 법령 조문 인용 시 출처를 명확히 표시하세요. 예: "근로기준법 제60조에 따르면..."
4. 개인 소송, 법적 판단은 제공하지 않고 변호사/법무사 상담을 권장하세요.
5. 답변은 4~6문장으로 핵심만 명확하게, 친근하고 이해하기 쉬운 언어로 작성하세요.
6. 적절한 이모지를 사용해 읽기 편하게 해주세요.
7. **중요한 법령명**은 **굵게** 표시하세요.`;

let history = [];
let busy = false;

// ✅ 표정 전환(현재 화면에 존재하는 모든 봇 이미지에 적용)
function setEmotion(type){
  document.querySelectorAll(".bot-img").forEach(img=>{
    img.src = BOT_BASE + "dj-ai-" + type + ".png";
  });
}

// 시간 표시
function now() {
  return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
function todayStr() {
  return new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
}

document.getElementById('today-label').textContent = todayStr();
document.getElementById('welcome-time').textContent = now();
document.getElementById('input').addEventListener('input', e => {
  document.getElementById('char-count').textContent = `${e.target.value.length} / 500`;
});

// 빠른 질문
function quickAsk(text) {
  document.getElementById('input').value = text;
  autoResize(document.getElementById('input'));
  send();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// 메시지 추가
function addMsg(role, text, lawCards = []) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';

  // ✅ 여기만 수정(봇은 이미지 / 유저는 기존 유지)
  if (role === 'bot') {
    avatar.innerHTML = `<img class="bot-img" src="${BOT_BASE}dj-ai-default.png" alt="bot">`;
  } else {
    avatar.textContent = '👤';
  }

  const col = document.createElement('div');
  col.className = 'msg-col';

  if (role === 'bot') {
    const name = document.createElement('span');
    name.className = 'msg-name';
    name.textContent = '법령 AI';
    col.appendChild(name);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  col.appendChild(bubble);

  // 법령 카드
  if (lawCards.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'law-section';
    const label = document.createElement('div');
    label.className = 'law-section-label';
    label.textContent = '📋 관련 법령';
    sec.appendChild(label);
    lawCards.forEach(law => {
      const a = document.createElement('a');
      a.className = 'law-card';
      a.href = `https://www.law.go.kr/LSW/lsSc.do?menuId=1&subMenuId=15&query=${encodeURIComponent(law.name)}#undefined`;
      a.target = '_blank';
      a.innerHTML = `
        <div class="law-card-icon">📄</div>
        <div class="law-card-body">
          <div class="law-card-name">${law.name}</div>
          <div class="law-card-sub">${law.sub || '국가법령정보센터에서 확인'}</div>
        </div>
        <div class="law-card-arrow">→</div>`;
      sec.appendChild(a);
    });
    col.appendChild(sec);
  }

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = now();
  col.appendChild(time);

  wrap.appendChild(avatar);
  wrap.appendChild(col);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

// 타이핑 인디케이터
function showTyping() {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';

  // ✅ 타이핑 중에는 thinking 표정
  wrap.innerHTML = `
    <div class="msg-avatar">
      <img class="bot-img" src="${BOT_BASE}dj-ai-thinking.png" alt="bot">
    </div>
    <div class="msg-col">
      <div class="typing-wrap">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>`;

  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}
function hideTyping() {
  document.getElementById('typing')?.remove();
}

// 법령 API
async function searchLaw(query) {
  // 법령 API 키가 없으면 키워드 매칭으로 대체
  if (!LAW_API_KEY) return fallbackLaws(query);

  try {
    // allorigins 프록시로 CORS 우회 (서버 없이 동작)
    const lawUrl = `https://open.law.go.kr/LSO/lawSearch.do?menuId=2&searchField=all&query=${encodeURIComponent(query)}&display=3&search=1&type=JSON&OC=${LAW_API_KEY}`;
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(lawUrl)}`;

    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error('프록시 오류');

    const wrapper = await res.json();
    const data = JSON.parse(wrapper.contents);

    if (data?.LawSearch?.law) {
      const arr = Array.isArray(data.LawSearch.law) ? data.LawSearch.law : [data.LawSearch.law];
      return arr.slice(0, 3).map(l => ({
        name: l['법령명한글'] || l.lawName || '',
        sub:  l['법령구분명'] || l.lawType || ''
      })).filter(l => l.name);
    }
  } catch (e) {
    console.warn('법령 API 실패, 키워드 매칭으로 대체:', e.message);
  }
  return fallbackLaws(query);
}

function fallbackLaws(q) {
  const map = [
    { kw: ['근로','노동','연차','임금','퇴직','해고','주휴','야근'], name:'근로기준법', sub:'근로자 권리 보호' },
    { kw: ['임대','전세','월세','보증금','세입자','집주인'], name:'주택임대차보호법', sub:'임차인 권리 보호' },
    { kw: ['개인정보','정보보호','데이터'], name:'개인정보 보호법', sub:'개인정보 수집·이용 기준' },
    { kw: ['소비자','환불','청약철회','반품'], name:'소비자기본법', sub:'소비자 권익 증진' },
    { kw: ['교통','음주운전','속도','신호위반'], name:'도로교통법', sub:'교통 안전 및 단속' },
    { kw: ['형사','처벌','범죄','벌금','징역'], name:'형법', sub:'범죄와 형벌 규정' },
    { kw: ['계약','손해배상','채무'], name:'민법', sub:'민사 기본 법률' },
    { kw: ['세금','소득세','부가세'], name:'국세기본법', sub:'국세 기본 사항' },
    { kw: ['상속','유언','유류분'], name:'민법 (상속편)', sub:'상속·유언 규정' },
    { kw: ['회사','주식','법인'], name:'상법', sub:'기업 및 상거래 법률' },
  ];
  return map.filter(m => m.kw.some(k => q.includes(k))).slice(0,2).map(m => ({name:m.name, sub:m.sub}));
}

// OpenAI GPT API
async function askClaude(userMsg) {
  history.push({ role: 'user', content: userMsg });
  if (history.length > 20) history = history.slice(-20);

  const messages = [
    { role: 'system', content: CLAUDE_SYSTEM },
    ...history
  ];

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${GPT_API_KEY}`
    },
    body: JSON.stringify({
      model: 'gpt-4o',
      max_tokens: 800,
      messages: messages
    })
  });

  if (!res.ok) {
    const e = await res.json();
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const reply = data.choices[0].message.content;
  history.push({ role: 'assistant', content: reply });
  return reply;
}

// 전송
async function send() {
  if (busy) return;
  const inp = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  const text = inp.value.trim();
  if (!text || text.length > 500) return;

  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('char-count').textContent = '0 / 500';
  busy = true;
  btn.disabled = true;

  addMsg('user', text);

  // ✅ 질문 보낸 직후: thinking 표정
  setEmotion("thinking");
  showTyping();

  try {
    const [reply, laws] = await Promise.all([askClaude(text), searchLaw(text)]);
    hideTyping();

    // ✅ 답변 내용에 따라 표정 전환
    const danger = ["징역","벌금","처벌","과태료","위반","형사","벌칙","행정처분","영업정지"];
    const isWarning = danger.some(w => reply.includes(w));
    setEmotion(isWarning ? "warning" : "default");

    addMsg('bot', reply, laws);

  } catch (err) {
    hideTyping();

    // ✅ 오류/키 문제: error 표정
    setEmotion("error");

    const msg = err.message?.includes('API key') || err.message?.includes('401') || err.message?.includes('Incorrect')
      ? '🔑 GPT API 키를 확인해주세요! 코드 상단 GPT_API_KEY에 올바른 키(sk-...)를 입력해주세요.'
      : `오류가 발생했어요 😥\n(${err.message})`;
    addMsg('bot', msg);
  } finally {
    busy = false;
    btn.disabled = false;
    inp.focus();
  }
}
