<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동진 Safety AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --dj:#004080;
  --dj2:#2a6cf6;
  --bg:#f4f7ff;
  --line:#d0d7e6;
  --err:#e53935;
  --expert:#eef0ff;
  --expert-line:#4b3df0;
}

body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:var(--bg);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== 상단 ===== */
.topbar{
  background:linear-gradient(135deg,var(--dj),var(--dj2));
  color:#fff;
  padding:1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:transparent;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

/* ===== 모드 버튼 ===== */
.mode-wrap{
  display:flex;
  gap:8px;
}

.mode-btn{
  padding:6px 14px;
  border-radius:20px;
  font-size:.85rem;
  cursor:pointer;
  background:rgba(255,255,255,.25);
}

.mode-btn.active{
  background:#fff;
  color:var(--dj);
  font-weight:700;
}

/* ===== 빠른 질문 칩 ===== */
.chips{
  padding:10px 1rem;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip{
  background:#fff;
  padding:6px 12px;
  border-radius:20px;
  font-size:.85rem;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

/* ===== 채팅 ===== */
.chat{
  flex:1;
  overflow-y:auto;
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:1rem;
}

/* fadeUp */
.fadeUp{
  animation:fadeUp .25s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(8px);}
  to{opacity:1; transform:translateY(0);}
}

/* ===== 메시지 ===== */
.msg{
  display:flex;
  align-items:flex-end;
  gap:12px;
}

.msg.me{
  justify-content:flex-end;
}

.msg img{
  width:84px;
  height:84px;
  border-radius:50%;
  box-shadow:0 10px 22px rgba(0,0,0,.3);
}

.bubble{
  padding:0.9rem 1.1rem;
  border-radius:1.2rem;
  line-height:1.6;
  max-width:70%;
  position:relative;
  white-space:pre-wrap;
}

.bubble.me{
  background:var(--dj);
  color:#fff;
}

.bubble.me::after{
  content:"";
  position:absolute;
  right:-8px;
  bottom:14px;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:10px solid var(--dj);
}

.bubble.ai{
  background:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.bubble.ai::after{
  content:"";
  position:absolute;
  left:-8px;
  bottom:14px;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:10px solid #fff;
}

.bubble.ai.expert{
  background:var(--expert);
  border-left:4px solid var(--expert-line);
}

.bubble.ai.expert::after{
  border-right:10px solid var(--expert);
}

.bubble.ai.error{
  background:#fff5f5;
  color:var(--err);
}

/* ===== 입력 ===== */
.composer{
  padding:1rem;
  background:#fff;
  border-top:1px solid var(--line);
}

textarea{
  width:100%;
  min-height:70px;
  padding:.7rem;
  border-radius:1rem;
  border:1px solid var(--line);
}

.send{
  width:100%;
  margin-top:.7rem;
  padding:.8rem;
  background:var(--dj);
  color:#fff;
  border:0;
  border-radius:1rem;
  font-weight:700;
  cursor:pointer;
}

</style>
</head>
<body>

<div class="topbar">
  <div class="top-left">
    <img id="headerAvatar" class="avatar">
    <div>🏗 동진 본사 Safety AI</div>
  </div>

  <div class="mode-wrap">
    <div id="fastBtn" class="mode-btn active">⚡ 빠른</div>
    <div id="expertBtn" class="mode-btn">🔍 전문가</div>
  </div>
</div>

<div class="chips" id="chips"></div>

<div id="chat" class="chat"></div>

<div class="composer">
  <textarea id="q" placeholder="질문 입력 (Enter=전송 / Shift+Enter=줄바꿈)"></textarea>
  <button class="send" id="sendBtn" onclick="send()">전송</button>
</div>

<script>

/* ===== AVATAR ===== */
const AVATAR={
normal:"https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/safety-normal.png",
loading:"https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/safety-loading.png",
done:"https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/safety-done.png",
warn:"https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/safety-warning.png",
expert:"https://raw.githubusercontent.com/es1063122-creator/ai-bot/main/safety-expert.png"
};

document.getElementById("headerAvatar").src=AVATAR.normal;

function setAvatar(state){
  const el=document.getElementById("headerAvatar");
  el.src=AVATAR[state]||AVATAR.normal;
  if(state==="done"||state==="warn"){
    setTimeout(()=>el.src=AVATAR.normal,1500);
  }
}

/* ===== MODE ===== */
let currentMode="fast";
fastBtn.onclick=function(){
  currentMode="fast";
  fastBtn.classList.add("active");
  expertBtn.classList.remove("active");
};
expertBtn.onclick=function(){
  currentMode="expert";
  expertBtn.classList.add("active");
  fastBtn.classList.remove("active");
};

/* ===== QUICK CHIPS ===== */
const chipList=[
"위험성평가 작성 방법",
"중대재해처벌법 요약",
"TBM 스크립트 작성",
"사고 초기 대응 절차",
"안전보건교육 기준",
"작업계획서 필수 항목",
"질의회신 자료 찾아줘"
];

chipList.forEach(text=>{
  const c=document.createElement("div");
  c.className="chip";
  c.innerText=text;
  c.onclick=()=>{
    qEl.value=text;
    send();
  };
  chips.appendChild(c);
});

/* ===== SESSION ===== */
const SESSION_KEY="DJ_SAFETY_AI_SESSION";
let sessionId=localStorage.getItem(SESSION_KEY);
if(!sessionId){
  sessionId="sess-"+Date.now();
  localStorage.setItem(SESSION_KEY,sessionId);
}

/* ===== UI ===== */
const chatEl=document.getElementById("chat");
const qEl=document.getElementById("q");
const sendBtn=document.getElementById("sendBtn");

function addMessage(text,who,cls){
  const row=document.createElement("div");
  row.className="msg "+who+" fadeUp";

  if(who==="ai"){
    const img=document.createElement("img");
    img.src=document.getElementById("headerAvatar").src;
    row.appendChild(img);
  }

  const bubble=document.createElement("div");
  bubble.className="bubble "+who+(cls?" "+cls:"");
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop=chatEl.scrollHeight;

  if(who==="ai"){
    typeEffect(text,bubble);
  }else{
    bubble.innerText=text;
  }
}

/* ===== 타이핑 ===== */
function typeEffect(text,el){
  let i=0;
  function typing(){
    if(i<text.length){
      el.innerText+=text.charAt(i);
      i++;
      setTimeout(typing,15);
    }
  }
  typing();
}

/* ===== JSONP ===== */
const WEBAPP_URL="https://script.google.com/macros/s/AKfycbxhax9_om5XVyGKNUAMqhNbJXkPqbibLK_4XM-mUb7zavC3AbbWScolVJox86VmKkBE/exec";
const TIMEOUT_MS=55000;

function send(){
  const q=qEl.value.trim();
  if(!q)return;

  addMessage(q,"me");
  qEl.value="";
  setAvatar("loading");

  const loadingRow=document.createElement("div");
  loadingRow.className="msg ai";
  const img=document.createElement("img");
  img.src=AVATAR.loading;
  loadingRow.appendChild(img);
  const bubble=document.createElement("div");
  bubble.className="bubble ai";
  bubble.innerText="답변 생성 중...";
  loadingRow.appendChild(bubble);
  chatEl.appendChild(loadingRow);

  const callbackName="cb_"+Date.now();
  let finished=false;
  let timer;

  window[callbackName]=function(data){
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    loadingRow.remove();

    if(!data||data.ok===false){
      setAvatar("warn");
      addMessage("앗, 오류가 생겼어요 😢","ai","error");
      return;
    }

    if(currentMode==="expert"){
      setAvatar("expert");
      addMessage(data.answer||"응답 없음","ai","expert");
    }else{
      setAvatar("done");
      addMessage(data.answer||"응답 없음","ai");
    }
  };

  timer=setTimeout(function(){
    if(finished)return;
    finished=true;
    loadingRow.remove();
    setAvatar("warn");
    addMessage("⏱ 응답 시간이 초과되었습니다.","ai","error");
  },TIMEOUT_MS);

  const script=document.createElement("script");
  script.onerror=function(){
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    loadingRow.remove();
    setAvatar("warn");
    addMessage("❌ 네트워크 오류가 발생했습니다.","ai","error");
  };

  script.src=WEBAPP_URL+
  "?question="+encodeURIComponent(q)+
  "&mode="+currentMode+
  "&sessionId="+sessionId+
  "&callback="+callbackName;

  document.body.appendChild(script);
}

/* ===== ENTER ===== */
qEl.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

/* ===== WELCOME ===== */
setTimeout(()=>{
  addMessage("안녕하세요! 동진 Safety AI 안전이입니다 👷‍♀️✨\n\n궁금한 안전 질문을 입력해 주세요!","ai");
},1200);

</script>
</body>
</html>
