<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>동진 Safety AI</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --dj:#004080;
  --dj2:#2a6cf6;
  --bg:#f4f7ff;
  --line:#d0d7e6;
}
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:var(--bg);
  height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  background:linear-gradient(135deg,var(--dj),var(--dj2));
  color:#fff;
  padding:28px;
  font-size:36px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:30px;
  display:flex;
  flex-direction:column;
  gap:24px;
}
.bubble{
  padding:32px;
  border-radius:28px;
  line-height:2;
  white-space:pre-wrap;
  font-size:34px;
  max-width:100%;
}
.me{background:var(--dj);color:#fff;align-self:flex-end;}
.ai{background:#fff;color:#000;box-shadow:0 6px 20px rgba(0,0,0,.1);}
.composer{padding:24px;background:#fff;border-top:1px solid var(--line);}
textarea{width:100%;min-height:120px;font-size:32px;padding:28px;border-radius:24px;border:1px solid var(--line);}
.send{width:100%;margin-top:20px;font-size:34px;padding:28px;border:0;background:var(--dj);color:#fff;border-radius:24px;}
.controls{margin-top:18px;font-size:28px;}
</style>
</head>

<body>

<div class="topbar">
<div>동진 본사 Safety AI</div>
<div id="sessionBadge"></div>
</div>

<div id="chat" class="chat"></div>

<div class="composer">
<textarea id="q" placeholder="질문 입력 (Enter=전송)"></textarea>
<button class="send" onclick="send()">전송</button>

<div class="controls">
<label><input type="radio" name="mode" value="fast" checked> 빠른</label>
<label><input type="radio" name="mode" value="expert"> 전문가</label>
</div>
</div>

<script>

/************************************************
⭐ Apps Script URL
************************************************/
const WEBAPP_URL="https://script.google.com/macros/s/AKfycbyxoaRQiZa_1pkfanDZmfiiPcwpyeXWx01Ln06WIQ61Iwr-BEZ8y6X-iZqBXbbIWajc/exec";

/************************************************
세션
************************************************/
const SESSION_KEY="DJ_SAFETY_AI_SESSION";
let sessionId=localStorage.getItem(SESSION_KEY);

if(!sessionId){
  sessionId="sess-"+Date.now();
  localStorage.setItem(SESSION_KEY,sessionId);
}

document.getElementById("sessionBadge").innerText=sessionId;

/************************************************
UI
************************************************/
const chatEl=document.getElementById("chat");
const qEl=document.getElementById("q");

function mode(){
  return document.querySelector('input[name="mode"]:checked').value;
}

function addBubble(text,who){
  const div=document.createElement("div");
  div.className="bubble "+(who==="me"?"me":"ai");
  div.innerText=text;
  chatEl.appendChild(div);
  chatEl.scrollTop=chatEl.scrollHeight;
  return div;
}

/************************************************
🔥 JSONP 방식 (CORS 해결)
************************************************/
function send(){

  const q=qEl.value.trim();
  if(!q) return;

  addBubble(q,"me");
  qEl.value="";

  const loading=addBubble("답변 생성 중...","ai");

  const callbackName="cb_"+Date.now();

  window[callbackName]=function(data){
    chatEl.removeChild(loading);
    addBubble(data.answer||"응답 없음","ai");
    delete window[callbackName];
    script.remove();
  };

  const url=
    WEBAPP_URL+
    "?question="+encodeURIComponent(q)+
    "&mode="+mode()+
    "&sessionId="+sessionId+
    "&callback="+callbackName;

  const script=document.createElement("script");
  script.src=url;
  document.body.appendChild(script);
}

qEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});

</script>
</body>
</html>
